<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | To Dublin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Rye&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #E3D5C1;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    
    .error-404 {
      max-width: 600px;
    }
    
    .error-404__code {
      font-family: 'Rye', cursive;
      font-size: 160px;
      color: #7F180D;
      line-height: 1;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px rgba(212, 162, 76, 0.6),
        0 0 20px rgba(212, 162, 76, 0.4),
        0 0 40px rgba(212, 162, 76, 0.2);
      animation: pulse 2.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(212, 162, 76, 0.6),
          0 0 20px rgba(212, 162, 76, 0.4),
          0 0 40px rgba(212, 162, 76, 0.2);
      }
      50% {
        text-shadow:
          0 0 15px rgba(212, 162, 76, 0.8),
          0 0 30px rgba(212, 162, 76, 0.6),
          0 0 50px rgba(212, 162, 76, 0.4);
      }
    }
    
    .error-404__title {
      font-family: 'Cormorant Infant', serif;
      font-size: 42px;
      color: #D4A24C;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .error-404__text {
      font-size: 17px;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 32px;
    }
    
    .error-404__btn {
      display: inline-block;
      padding: 14px 32px;
      background: #20603D;
      color: #F7F3EE;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(32, 96, 61, 0.4);
      transition: all 0.25s ease;
    }
    
    .error-404__btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(32, 96, 61, 0.55);
    }
    
    .error-404__logo {
      font-family: 'Rye', cursive;
      font-size: 28px;
      color: #D4A24C;
      margin-top: 60px;
      text-decoration: none;
      letter-spacing: 1px;
    }
    
    @media (max-width: 768px) {
      .error-404__code { font-size: 100px; }
      .error-404__title { font-size: 32px; }
      .error-404__text { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="error-404">
    <div class="error-404__code">404</div>
    <h1 class="error-404__title">Страница не найдена</h1>
    <p class="error-404__text">
      Похоже, вы заблудились в наших ирландских просторах.<br>
      Эта страница не существует или была перемещена.
    </p>
    <a href="/" class="error-404__btn">Вернуться на главную</a>
    <a href="/" class="error-404__logo">To Dublin</a>
  </div>
</body>
</html>
